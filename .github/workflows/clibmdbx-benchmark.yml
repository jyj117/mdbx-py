name: clibmdbx benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - run: python -m pip install -U pip
      - run: python -m pip install "setuptools==84.0.0" "wheel==0.48.0" "libmdbx==0.3.2"
      - run: python -m pip install . --no-build-isolation
      - run: mkdir -p benchmarks/results/ci
      - run: python benchmarks/benchmark.py --cpu 0 --output benchmarks/results/ci/run1.json
      - run: python benchmarks/benchmark.py --cpu 0 --output benchmarks/results/ci/run2.json
      - run: python benchmarks/benchmark.py --cpu 0 --output benchmarks/results/ci/run3.json
      - run: python benchmarks/summarize.py benchmarks/results/ci/run*.json --output benchmarks/results/ci/summary.json
      - run: python benchmarks/check_performance.py benchmarks/results/ci/summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-linux-x86-64
          path: benchmarks/results/ci/*.json
          retention-days: 30
