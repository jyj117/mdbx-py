name: clibmdbx publish

on:
  push:
    tags: ["clibmdbx-v*"]

permissions:
  contents: read

concurrency:
  group: clibmdbx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install "packaging==26.3"
      - id: version
        name: Validate immutable tag and package versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#clibmdbx-v}"
          python scripts/check_version.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python scripts/check_release_configuration.py
      - run: python scripts/verify_vendor.py
      - run: python scripts/check_api_coverage.py

  wheels:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            artifact: linux-x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            artifact: linux-aarch64
          - runner: macos-15-intel
            arch: x86_64
            artifact: macos-x86_64
          - runner: macos-14
            arch: arm64
            artifact: macos-arm64
          - runner: windows-2022
            arch: AMD64
            artifact: windows-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          package-dir: .
          output-dir: wheelhouse
      - name: Reject external libmdbx and unexpected native dependencies
        run: python scripts/check_wheel_native.py "wheelhouse/*.whl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-part-wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  sdist:
    needs: validate-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install "build==1.5.0"
      - name: Build the source distribution twice and require byte identity
        shell: bash
        run: |
          epoch="$(git log -1 --pretty=%ct)"
          SOURCE_DATE_EPOCH="$epoch" python -m build --sdist --outdir dist-a
          SOURCE_DATE_EPOCH="$epoch" python -m build --sdist --outdir dist-b
          cmp dist-a/*.tar.gz dist-b/*.tar.gz
          mkdir -p dist
          cp dist-a/*.tar.gz dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-part-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [validate-tag, wheels, sdist]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-part-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install "packaging==26.3" "twine==7.0.0"
      - run: python -m twine check --strict dist/*
      - run: python scripts/inspect_artifacts.py dist/*
      - name: Install and test the exact source distribution in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/clibmdbx-sdist-test
          /tmp/clibmdbx-sdist-test/bin/python -m pip install -U pip "pytest==9.1.1"
          /tmp/clibmdbx-sdist-test/bin/python -m pip install --no-cache-dir dist/*.tar.gz
          TMPDIR=/tmp /tmp/clibmdbx-sdist-test/bin/python -m pytest -q tests
      - name: Require the complete versioned wheel matrix and record hashes
        run: >-
          python scripts/check_release_artifacts.py
          --full-matrix
          --checksums SHA256SUMS
          "${{ needs.validate-tag.outputs.version }}"
          dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sha256
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  testpypi:
    needs: assemble
    runs-on: ubuntu-22.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/clibmdbx
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Publish the reviewed artifacts to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          print-hash: true
          skip-existing: true

  verify-testpypi:
    needs: [validate-tag, testpypi]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Match every TestPyPI filename and SHA-256 to the reviewed artifacts
        run: >-
          python scripts/verify_index_release.py
          --index https://test.pypi.org
          clibmdbx
          "${{ needs.validate-tag.outputs.version }}"
          dist/*
      - name: Install the TestPyPI wheel and run lifecycle smoke tests
        run: >-
          python scripts/index_install_smoke.py
          --index https://test.pypi.org/simple/
          clibmdbx
          "${{ needs.validate-tag.outputs.version }}"

  publish:
    needs: [validate-tag, assemble, verify-testpypi]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/clibmdbx
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Publish the exact TestPyPI-verified artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          print-hash: true

  verify-pypi:
    needs: [validate-tag, publish]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Match every PyPI filename and SHA-256 to the reviewed artifacts
        run: >-
          python scripts/verify_index_release.py
          --index https://pypi.org
          clibmdbx
          "${{ needs.validate-tag.outputs.version }}"
          dist/*
      - name: Install the PyPI wheel and run lifecycle smoke tests
        run: >-
          python scripts/index_install_smoke.py
          --index https://pypi.org/simple/
          clibmdbx
          "${{ needs.validate-tag.outputs.version }}"
