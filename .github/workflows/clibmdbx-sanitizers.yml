name: clibmdbx native safety

on:
  push:
    paths: ["src/**", "vendor/**", "tests/**", "setup.py", "pyproject.toml", ".github/workflows/clibmdbx-sanitizers.yml"]
  pull_request:
    paths: ["src/**", "vendor/**", "tests/**", "setup.py", "pyproject.toml", ".github/workflows/clibmdbx-sanitizers.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - run: python -m pip install -U pip
      - run: python -m pip install "setuptools==84.0.0" "wheel==0.48.0" "pytest==9.1.1"
      - run: CLIBMDBX_SANITIZE=address,undefined CLIBMDBX_STRICT=1 python -m pip install -e . --no-build-isolation
      - name: Run ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHONMALLOC: malloc
          TMPDIR: /tmp
        run: LD_PRELOAD="$(gcc -print-file-name=libasan.so)" python -m pytest -vv

  valgrind:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: python -m pip install -U pip
      - run: python -m pip install "setuptools==84.0.0" "wheel==0.48.0"
      - run: CLIBMDBX_STRICT=1 python -m pip install . --no-build-isolation
      - name: Run native lifecycle smoke under Valgrind
        env:
          PYTHONMALLOC: malloc
          TMPDIR: /tmp
        run: >-
          valgrind --error-exitcode=97 --track-origins=yes --leak-check=full
          --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect
          --suppressions=tests/valgrind-python.supp
          python tests/valgrind_smoke.py
